# Build-only. dnsmasq and squid-proxy are no longer run from here as a
# shared stack -- each project's docker-compose.claude.yml runs its own
# pair, on its own network. This file just builds and tags the two images
# they're both built from:
#
#   docker compose -f docker-compose.yaml build
#
# Re-run after editing dnsmasq/dnsmasq.conf or proxy/squid.conf, then
# recreate any running project containers to pick up the change (rebuild,
# don't live-patch -- same as everything else in this repo).

services:
  dnsmasq:
    build: ./dnsmasq
    image: claude-sandbox-dnsmasq

  squid-proxy:
    build: ./proxy
    image: claude-sandbox-squid
