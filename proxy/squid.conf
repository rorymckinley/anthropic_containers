# squid for the Claude Code sandbox: a CONNECT-only relay to Anthropic.
#
# Runtime constraints this config is written against (see the per-project
# compose file): runs as uid 1000, root fs is read_only, cap_drop ALL,
# no-new-privileges, and the only writable paths are the /tmp and /run
# tmpfs mounts. Every path squid might write to is therefore pointed at
# stdout/stderr, /tmp, or disabled outright. Ubuntu's compiled-in defaults
# (/var/log/squid, /run/squid.pid, /var/spool/squid) are all unwritable
# here and would stop squid from starting.

http_port 3128

# squid FATALs at startup if it can't work out a fully-qualified hostname
# and none is configured. Container hostnames are usually resolvable via
# /etc/hosts, but don't depend on it.
visible_hostname sandbox-proxy

# ---- Writable-path hygiene -------------------------------------------
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
netdb_filename none
coredump_dir /tmp
logfile_rotate 0

# The ICMP pinger helper is setuid root; it can't start under
# no-new-privileges and we don't want it anyway.
pinger_enable off

# Nothing here is cacheable (it's all CONNECT tunnels) and there is no
# cache_dir. Say so explicitly so no memory cache is kept either.
cache deny all

# ---- Egress policy ---------------------------------------------------
# This is the sandbox's whole egress policy: the anthropic_containers
# network is `internal`, so squid is the only way a byte leaves it.
#
# A request must pass BOTH legs:
#   anthropic_hosts -- the hostname in the CONNECT request is one of the
#                      three Claude Code actually needs (API + the two
#                      OAuth token endpoints). Matched as a string; squid
#                      does no DNS lookup for this leg, so an attacker
#                      can't satisfy it with a name they control.
#   anthropic_ip    -- that hostname resolves (via squid's own resolver,
#                      i.e. the host's DNS, not the sandbox's dnsmasq) to
#                      Anthropic's pinned address. Belt-and-braces against
#                      a hostname in the list being pointed elsewhere.
#
# Both legs fail closed: if Anthropic moves the API to a new address, or
# Claude Code starts needing a new host, Claude Code stops working and the
# fix is one line here plus an image rebuild -- never a live edit.
# Note the pinned IP alone is wider than it looks: Anthropic fronts
# claude.ai, www.anthropic.com and others at the same address, which is
# why the hostname leg exists.
acl SSL_ports port 443
acl anthropic_hosts dstdomain api.anthropic.com console.anthropic.com platform.claude.com
acl anthropic_ip dst 160.79.104.10

# `CONNECT` is a predefined ACL (method CONNECT) -- don't redeclare it.
http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT anthropic_hosts anthropic_ip
http_access deny all

# The egress network is IPv4-only; don't waste time on AAAA answers.
dns_v4_first on

# ---- Don't advertise ourselves or the client upstream -----------------
via off
forwarded_for delete
httpd_suppress_version_string on

# Don't hold `compose down` for the default 30s drain.
shutdown_lifetime 1 seconds
